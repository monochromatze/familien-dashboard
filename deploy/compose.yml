# Docker Compose für das Familien-Dashboard.
# Starten (Entwicklung):  docker compose --env-file deploy/dev.env -f deploy/compose.yml -f deploy/compose.dev.yml up -d
# Stoppen, Daten bleiben: docker compose -f deploy/compose.yml down
# Stoppen UND Daten weg:  docker compose -f deploy/compose.yml down -v
#
# Die Datei ist für alle Stufen gleich (Entwicklung, QA, Prod). Unterschiede stehen nur in der
# env-Datei. Passwörter stehen nie hier, sondern in deploy/*.env (nicht in Git).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB fehlt, siehe deploy/dev.env.example}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt, siehe deploy/dev.env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt, siehe deploy/dev.env.example}
    volumes:
      # Benanntes Volume: Daten überleben "docker compose down", nur "down -v" löscht sie.
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
