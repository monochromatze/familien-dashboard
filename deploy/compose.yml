# Docker Compose für das Familien-Dashboard.
# Starten (Entwicklung):  docker compose --env-file deploy/dev.env -f deploy/compose.yml -f deploy/compose.dev.yml up -d
# Stoppen, Daten bleiben: docker compose -f deploy/compose.yml down
# Stoppen UND Daten weg:  docker compose -f deploy/compose.yml down -v
#
# Die Datei ist für alle Stufen gleich (Entwicklung, QA, Prod). Unterschiede stehen nur in der
# env-Datei. Passwörter stehen nie hier, sondern in deploy/*.env (nicht in Git).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB fehlt, siehe deploy/dev.env.example}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt, siehe deploy/dev.env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt, siehe deploy/dev.env.example}
    volumes:
      # Benanntes Volume: Daten überleben "docker compose down", nur "down -v" löscht sie.
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    # Das Image bekommt einen Tag. Später (QA/Prod) ist das die Git-SHA: einmal bauen, mehrfach ausrollen.
    image: familien-dashboard:${APP_TAG:-dev}
    environment:
      # Zugangsdaten kommen aus der env-Datei. "db" ist der Name des Datenbank-Dienstes im Compose-Netz.
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Standard: nur auf diesem Mac erreichbar. Für den Zugriff im WLAN setzt Prod APP_BIND=0.0.0.0.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
